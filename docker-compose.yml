# Local Postgres for development: `docker compose up -d`, then `pnpm db:migrate`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vertragsmarkt
      POSTGRES_PASSWORD: vertragsmarkt
      POSTGRES_DB: vertragsmarkt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
